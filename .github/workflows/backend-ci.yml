name: Backend CI

on:
  push:
    branches:
      - dev
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-ci:
    uses: cyaris/shared-automation/.github/workflows/python-ci.yml@main
    with:
      working-directory: backend
